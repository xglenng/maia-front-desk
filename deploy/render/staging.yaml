# Render services. Production accepts configured live integrations; staging remains isolated.
# Free compute and the expiring free database are retained at the owner's request.
# Railway callback cutover and scheduler retirement are separate operator steps.
services:
  - type: web
    name: maia-render-staging
    runtime: node
    region: oregon
    plan: free
    branch: codex/pr1-production-readiness
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_URL
        value: postgresql://127.0.0.1:1/maia_disconnected
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: MAIA_STAGING_ISOLATED
        value: '1'
      - key: AI_PROVIDER
        value: mock
      - key: NEXT_PUBLIC_AI_PROVIDER
        value: mock
      - key: TWILIO_PROVISION_MODE
        value: mock
      - key: TWILIO_PORT_MODE
        value: mock
      - key: TWILIO_COMPLIANCE_MODE
        value: mock
      - key: TWILIO_ACCOUNT_CREATION_ENABLED
        value: 'false'
      - key: META_MESSAGING_MODE
        value: mock
      - key: SQUARE_ENVIRONMENT
        value: sandbox
      - key: MAIA_STRIPE_CONNECT_ENABLED
        value: 'false'
      - key: MAIA_STRIPE_TERMINAL_ENABLED
        value: 'false'
  - type: web
    name: maia-production-preview
    runtime: node
    region: oregon
    plan: free
    branch: codex/pr1-production-readiness
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: maia-render-production-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        value: https://maia-production-preview.onrender.com
      - key: MAIA_STAGING_ISOLATED
        value: '0'
      - key: AI_PROVIDER
        value: openai
      - key: NEXT_PUBLIC_AI_PROVIDER
        value: openai
      - key: TWILIO_PROVISION_MODE
        value: mock
      - key: TWILIO_PORT_MODE
        value: mock
      - key: TWILIO_COMPLIANCE_MODE
        value: mock
      - key: TWILIO_ACCOUNT_CREATION_ENABLED
        value: 'false'
      - key: META_MESSAGING_MODE
        value: live
      - key: SQUARE_ENVIRONMENT
        value: production
      - key: TWILIO_VALIDATE_SIGNATURE
        value: 'true'
      - key: TWILIO_WEBHOOK_BASE_URL
        value: https://maia-production-preview.onrender.com
      - key: META_REDIRECT_URI
        value: https://maia-production-preview.onrender.com/api/integrations/meta/callback
      - key: GOOGLE_REDIRECT_URI
        value: https://maia-production-preview.onrender.com/api/integrations/google/callback
      - key: SQUARE_REDIRECT_URI
        value: https://maia-production-preview.onrender.com/api/integrations/square/callback
      - key: MAIA_STRIPE_CONNECT_ENABLED
        value: 'false'
      - key: MAIA_STRIPE_TERMINAL_ENABLED
        value: 'false'

databases:
  - name: maia-render-production-db
    region: oregon
    plan: free
    postgresMajorVersion: '17'
    databaseName: maia_render_production
    ipAllowList: []
